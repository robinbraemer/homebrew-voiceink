name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate + key from p12
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # Extract cert and trust it for code signing
          openssl pkcs12 -in $RUNNER_TEMP/cert.p12 -clcerts -nokeys \
            -passin pass:"$SIGNING_CERTIFICATE_PASSWORD" -out $RUNNER_TEMP/cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "$KEYCHAIN_PATH" $RUNNER_TEMP/cert.pem

          # Allow codesign to use it without prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Get the identity name for later steps
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Build VoiceInk
        run: |
          make check setup
          xcodebuild -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Debug \
            -derivedDataPath .local-build \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=$(pwd)/VoiceInk/VoiceInk.local.entitlements \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            ENABLE_DEBUG_DYLIB=NO \
            build

      - name: Prepare app bundle
        run: |
          APP_PATH=".local-build/Build/Products/Debug/VoiceInk.app"
          # Verify signature
          codesign -dvv "$APP_PATH" 2>&1 | head -5
          # Copy to Downloads for compatibility with existing zip step
          ditto "$APP_PATH" ~/Downloads/VoiceInk.app
          xattr -cr ~/Downloads/VoiceInk.app

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' VoiceInk.xcodeproj/project.pbxproj | sed 's/.*= *\([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent ~/Downloads/VoiceInk.app ${{ github.workspace }}/VoiceInk.app.zip

      - name: Delete existing release
        run: gh release delete v${{ steps.version.outputs.version }} --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VoiceInk v${{ steps.version.outputs.version }}
          files: ${{ github.workspace }}/VoiceInk.app.zip
          generate_release_notes: true
          make_latest: true

      - name: Verify release asset is downloadable
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/VoiceInk.app.zip"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "Release asset reachable: $URL"
              exit 0
            fi
            echo "Attempt $attempt got HTTP $CODE, retrying in 5s..."
            sleep 5
          done
          echo "::error::Release asset never became reachable: $URL"
          exit 1

      - name: Sync cask to released version
        run: |
          git fetch origin main
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"${{ steps.version.outputs.version }}\"/" Casks/voiceink-local.rb
          if git diff --quiet -- Casks/voiceink-local.rb; then
            echo "Cask already at v${{ steps.version.outputs.version }}, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Casks/voiceink-local.rb
            git commit -m "Bump voiceink-local cask to v${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
