name: Sync Upstream

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday at 8am UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voiceink-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Beingpax/VoiceInk.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new changes
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor "$UPSTREAM_HEAD" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          if ! git merge --no-edit upstream/main; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "::error::Upstream merge conflict in: ${CONFLICTS}"
            echo "::error::Resolve locally with: git fetch upstream && git merge upstream/main"
            git merge --abort
            exit 1
          fi

      - name: Update cask version
        if: steps.check.outputs.has_changes == 'true'
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' VoiceInk.xcodeproj/project.pbxproj | sed 's/.*= *\([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
          # Update version in cask file if changed
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/voiceink-local.rb
          if ! git diff --quiet Casks/voiceink-local.rb; then
            git add Casks/voiceink-local.rb
            git commit -m "Update voiceink-local cask to v${VERSION}"
          fi

      - name: Push updated main
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin HEAD:main

      - name: Tag and trigger build
        if: steps.check.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG"
